services:
  db:
    image: postgres:16-alpine
    container_name: sicv-db
    environment:
      POSTGRES_DB: sicv
      POSTGRES_USER: sicv
      POSTGRES_PASSWORD: sicv_dev_password
    ports:
      - "5433:5432"
    volumes:
      - sicv_pg_data:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sicv -d sicv"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
    container_name: sicv-backend
    environment:
      DATABASE_URL: postgresql://sicv:sicv_dev_password@db:5432/sicv
      ADMIN_API_TOKEN: sicv-admin-local
      CORS_ORIGINS: http://localhost:5173,http://127.0.0.1:5173,http://localhost:5174,http://127.0.0.1:5174
      PUBLIC_VERIFICATION_BASE_URL: http://localhost:5173/v
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./backend/app:/app/app
      - sicv_uploads:/app/uploads

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: sicv-frontend
    environment:
      VITE_API_URL: http://localhost:8000/api/v1
    ports:
      - "5173:5173"
    depends_on:
      - backend
    volumes:
      - ./src:/app/src
      - ./index.html:/app/index.html
      - ./tailwind.config.js:/app/tailwind.config.js
      - ./postcss.config.js:/app/postcss.config.js
      - ./vite.config.js:/app/vite.config.js
      - /app/node_modules

volumes:
  sicv_pg_data:
  sicv_uploads:
